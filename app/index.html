<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kotoba — spaced-repetition flash cards for Japanese vocabulary, read straight off photographed textbook pages.">
  <meta name="theme-color" content="#2b3f8c">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kotoba">
  <title>Kotoba</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Fonts are optional; system fallbacks are declared in style.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">

  <!-- Apply the saved theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('kotoba.progress.v1');
        var theme = raw && JSON.parse(raw).settings && JSON.parse(raw).settings.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* storage unavailable: fall back to the system theme */ }
    })();
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar"><div class="bar-in">
    <div class="brand">ことば <small>Kotoba</small></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="review" aria-selected="true">Review</button>
      <button role="tab" data-tab="add" aria-selected="false">Add</button>
      <button role="tab" data-tab="words" aria-selected="false">Words</button>
      <button role="tab" data-tab="settings" aria-selected="false" aria-label="Settings">&#9881;</button>
    </nav>
  </div></header>

  <main class="wrap" id="main">
    <section id="view-review"></section>
    <section id="view-add" hidden></section>
    <section id="view-words" hidden></section>
    <section id="view-settings" hidden></section>
    <noscript><p class="notice">Kotoba needs JavaScript.</p></noscript>
  </main>
</body>
</html>
